# Self-hosted Starring: app + Postgres.
#   cp .env.example .env   # set BETTER_AUTH_SECRET and BETTER_AUTH_URL
# Optional features are switched on in .env too: SMTP, Plausible, and CV import with AI
# (ANTHROPIC_API_KEY or OPENAI_API_KEY; see docs/self-hosting.md#cv-import-ai), and photo
# uploads (STORAGE=local keeps them in the uploads volume below; see #uploads-storage).
#   docker compose up -d
services:
  app:
    build: .
    image: starring:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://starring:${POSTGRES_PASSWORD:-starring}@db:5432/starring
      # the app always listens on 4321 inside the container; PORT in .env is the host port
      PORT: "4321"
    ports:
      - "${PORT:-4321}:4321"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # optional: profiles kept as YAML files alongside DB profiles
      - ./profiles:/app/profiles:ro
      # uploaded photos when STORAGE=local
      - starring-uploads:/app/data/uploads

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: starring
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-starring}
      POSTGRES_DB: starring
    volumes:
      - starring-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starring"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  starring-db:
  starring-uploads:
