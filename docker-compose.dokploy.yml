# Starring on Dokploy (Compose service + GitHub integration).
#
# In Dokploy: Create Service → Compose → Provider: GitHub → repo pipozzz/starring,
# branch main, Compose Path: ./docker-compose.dokploy.yml. Then:
#   Environment tab → paste the variables below (see docs/self-hosting.md#dokploy)
#   Domains tab     → Service: app, Port: 4321, HTTPS on, e.g. starring.dev
# No ports are published: Dokploy attaches its Traefik network and routes the domain.
# Postgres stays on the internal network only.
#
# Only ${VAR} and ${VAR:-default} are used on purpose: Nomploy translates this file to a
# Nomad job with its own substitution, which doesn't support ${VAR:?error} or nested
# defaults. Required: BETTER_AUTH_URL, BETTER_AUTH_SECRET, POSTGRES_PASSWORD — the app
# refuses to start without them (see scripts/migrate.mjs).

services:
  app:
    # Prebuilt by .github/workflows/image.yml. Pin a release with STARRING_IMAGE_TAG
    # (e.g. sha-1a2b3c4) for reproducible deploys and rollbacks.
    image: ghcr.io/pipozzz/starring:${STARRING_IMAGE_TAG:-latest}
    pull_policy: always
    # To build on the server instead (e.g. from a fork), replace the two lines above with:
    # build: .
    restart: unless-stopped
    expose:
      - "4321"
    environment:
      STARRING_MODE: server
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4321"
      DATABASE_URL: postgres://starring:${POSTGRES_PASSWORD}@db:5432/starring
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      SITE_URL: ${SITE_URL:-}
      REDIRECT_HOSTS: ${REDIRECT_HOSTS:-}
      # the app is only reachable through the platform's proxy, so X-Forwarded-For is trustworthy
      TRUST_PROXY: ${TRUST_PROXY:-true}
      CUSTOM_DOMAINS: ${CUSTOM_DOMAINS:-false}
      # CV import with AI: set ONE key to turn it on (off when both are empty).
      # Setup, cost, privacy and limits: docs/self-hosting.md#cv-import-ai
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CV_IMPORT_PROVIDER: ${CV_IMPORT_PROVIDER:-}
      CV_IMPORT_MODEL: ${CV_IMPORT_MODEL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      CV_IMPORT_DAILY_LIMIT: ${CV_IMPORT_DAILY_LIMIT:-200}
      # photo uploads: local (the uploads volume) or s3; off when empty — docs/self-hosting.md#uploads-storage
      STORAGE: ${STORAGE:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      SIGNUP_ALLOWLIST: ${SIGNUP_ALLOWLIST:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-true}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      # Find updates (autodiscovery) for owners who didn't sign in with GitHub — public data only
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITLAB_CLIENT_ID: ${GITLAB_CLIENT_ID:-}
      GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET:-}
      GITLAB_ISSUER: ${GITLAB_ISSUER:-https://gitlab.com}
      PLAUSIBLE_SRC: ${PLAUSIBLE_SRC:-}
      PLAUSIBLE_API_KEY: ${PLAUSIBLE_API_KEY:-}
      PLAUSIBLE_API_HOST: ${PLAUSIBLE_API_HOST:-}
      PLAUSIBLE_SITE_ID: ${PLAUSIBLE_SITE_ID:-}
      WEEKLY_DIGEST: ${WEEKLY_DIGEST:-}
      OPERATOR_NAME: ${OPERATOR_NAME:-}
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:-}
      OPERATOR_ADDRESS: ${OPERATOR_ADDRESS:-}
      OPERATOR_COUNTRY: ${OPERATOR_COUNTRY:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      BLOCKED_HANDLES: ${BLOCKED_HANDLES:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Starring <no-reply@starring.dev>}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4321/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      # uploaded photos when STORAGE=local
      - starring-uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: starring
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: starring
    volumes:
      - starring-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starring"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  starring-db:
  starring-uploads:
