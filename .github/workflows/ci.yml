name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Types (astro check — .astro, .ts, .tsx)
        run: npm run check
      - name: Themes (id, WCAG contrast, scoped CSS)
        run: npm run check:themes
      - name: No whitespace errors
        if: github.event_name == 'pull_request'
        run: git fetch --depth=1 origin ${{ github.base_ref }} && git diff --check origin/${{ github.base_ref }} HEAD

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: CLI package is publishable (no npm warnings, bin kept)
        working-directory: cli
        run: |
          out=$(npm pack --dry-run --json 2>pack.err)
          if grep -i "warn" pack.err; then echo "::error::npm pack warned — fix cli/package.json"; exit 1; fi
          echo "$out" | node -e 'const [p]=JSON.parse(require("fs").readFileSync(0,"utf8")); const f=p.files.map(x=>x.path); for (const need of ["starring.mjs","scan.mjs","package.json"]) if(!f.includes(need)) throw new Error("missing "+need); console.log("ok:", f.join(", "))'
          node -e 'const p=require("./package.json"); if(!p.bin||!p.bin.starring) throw new Error("bin.starring missing")'

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Static build
        run: npm run build
      - name: Accessibility (axe-core on the main pages and every theme)
        run: npm run test:a11y
      - name: Static build under a project-pages base path (catches hard-coded "/" links)
        run: npm run build
        env:
          BASE_PATH: /starring
          SITE_URL: https://example.github.io
      - name: Server build
        run: npm run build:server

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: starring
          POSTGRES_PASSWORD: starring
          POSTGRES_DB: starring
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U starring" --health-interval 2s --health-timeout 3s --health-retries 30
      mail:
        image: axllent/mailpit:v1.27
        ports: ['1025:1025', '8025:8025']
    env:
      DATABASE_URL: postgres://starring:starring@localhost:5432/starring
      BETTER_AUTH_URL: http://localhost:4321
      SITE_URL: http://localhost:4321
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-000000
      ADMIN_EMAILS: e2e-admin@starring.test
      CUSTOM_DOMAINS: 'true'
      STORAGE: local
      STORAGE_DIR: /tmp/starring-uploads
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      HOST: 127.0.0.1
      PORT: 4321
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:server
      - run: npm run db:migrate
      - name: Migrations are committed (schema.ts and drizzle/ in sync)
        run: npx drizzle-kit generate --name ci-check && git diff --exit-code --stat -- drizzle/ && test -z "$(git status --porcelain drizzle/)"
      - name: Start server
        run: |
          node dist/server/entry.mjs > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4321/ >/dev/null && exit 0; sleep 1; done
          cat server.log; exit 1
      - run: npm run test:e2e
        env:
          E2E_URL: http://localhost:4321
          MAILPIT_URL: http://127.0.0.1:8025
          E2E_ADMIN_EMAIL: e2e-admin@starring.test
      - name: Server log
        if: failure()
        run: cat server.log

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: starring:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
